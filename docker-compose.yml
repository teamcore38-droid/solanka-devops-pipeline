services:
  solanka-tourism-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: solanka-tourism-api:latest
    container_name: solanka-tourism-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
